<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #e0f2fe);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card {
            background: white;
            width: min(650px, 90%);
            padding: 45px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
        }
        h1 { margin-bottom: 10px; }
        h2 { color: #15803d; }
        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            border-radius: 999px;
            background: #dcfce7;
            color: #166534;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student CI/CD Demonstration</h1>
        <h2>Deployment Successful</h2>
        <p>This webpage was deployed automatically using GitHub Actions.</p>
        <div class="status">Application Status: Running</div>
    </div>
</body>
</html>
